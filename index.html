<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>돌림판</title>
<style>
  :root {
    --bg: #f2f4f6; --card: #fff; --text: #191f28; --muted: #8b95a1;
    --accent: #3182f6; --accent-dark: #1b64da; --line: #e9ecef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 28px;
  }
  .app { display: flex; gap: 34px; align-items: center; flex-wrap: wrap; justify-content: center; }

  /* ── 돌림판 */
  .wheel-wrap { position: relative; width: min(520px, 88vw); aspect-ratio: 1; }
  canvas { width: 100%; height: 100%; display: block; }
  .pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent;
    border-top: 26px solid var(--text); filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); z-index: 3;
  }
  .hub {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 108px; height: 108px; border-radius: 50%; cursor: pointer; user-select: none; z-index: 2;
    border: 5px solid #fff;
    background: linear-gradient(180deg, #4d94ff, var(--accent) 55%, var(--accent-dark));
    box-shadow: 0 8px 22px rgba(49,130,246,.45), inset 0 2px 4px rgba(255,255,255,.5), inset 0 -5px 10px rgba(0,0,0,.18);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    color: #fff; font-weight: 900; font-size: 16px; letter-spacing: -.01em;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .hub .finger { font-size: 30px; line-height: 1; animation: tap 1.3s ease-in-out infinite; }
  @keyframes tap {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(4px) rotate(-8deg) scale(.92); }
  }
  .hub:hover { transform: translate(-50%,-50%) scale(1.07); box-shadow: 0 12px 28px rgba(49,130,246,.55), inset 0 2px 4px rgba(255,255,255,.5), inset 0 -5px 10px rgba(0,0,0,.18); }
  .hub:active { transform: translate(-50%,-50%) scale(.95); box-shadow: 0 4px 12px rgba(49,130,246,.4), inset 0 3px 8px rgba(0,0,0,.25); }
  .hub:disabled { filter: grayscale(.6); opacity: .75; cursor: default; }
  .hub:disabled .finger { animation: none; }

  /* ── 패널 */
  .panel { width: min(360px, 88vw); background: var(--card); border-radius: 24px; padding: 26px; box-shadow: 0 10px 34px rgba(0,0,0,.08); }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.02em; }
  .sub { margin: 0 0 16px; color: var(--muted); font-size: 13px; }

  /* 항목 리스트 (입력란 위로 쌓임) */
  .item-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 12px; max-height: 300px; overflow-y: auto; }
  .item-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--bg); border-radius: 12px; animation: slidein .18s ease;
  }
  @keyframes slidein { from { opacity: 0; transform: translateY(-5px); } }
  .item-row .dot { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
  .item-row .name { flex: 1; font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-row .del {
    flex-shrink: 0; width: 22px; height: 22px; border: 0; border-radius: 50%;
    background: rgba(0,0,0,.08); color: var(--muted); font-size: 11px; line-height: 1;
    cursor: pointer; display: grid; place-items: center; transition: background .12s, color .12s;
  }
  .item-row .del:hover { background: #ff6b6b; color: #fff; }
  .empty-note { padding: 14px; border: 1.5px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: 13px; text-align: center; margin-bottom: 12px; }

  /* 입력줄 */
  .input-row { display: flex; gap: 8px; }
  .input-row input {
    flex: 1; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px;
    font: inherit; font-size: 14.5px; outline: none; transition: border-color .15s; min-width: 0;
  }
  .input-row input:focus { border-color: var(--accent); }
  .btn-add {
    flex-shrink: 0; padding: 12px 18px; border: 0; border-radius: 12px;
    background: var(--text); color: #fff; font-weight: 800; font-size: 14px; cursor: pointer;
    transition: transform .1s ease, opacity .15s;
  }
  .btn-add:active { transform: scale(.96); }
  .count { margin-top: 8px; font-size: 12.5px; color: var(--muted); }

  .result {
    margin-top: 16px; padding: 16px; border-radius: 16px; background: var(--bg);
    text-align: center; min-height: 62px; display: grid; place-items: center;
  }
  .result .who { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .result .hint { color: var(--muted); font-size: 13px; }
  .result.win { background: #fff7e0; animation: pop .35s ease; }
  @keyframes pop { 0% { transform: scale(.92); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }

  .row { display: flex; gap: 8px; margin-top: 14px; }
  .btn {
    flex: 1; padding: 13px; border: 0; border-radius: 13px; font-weight: 800; font-size: 15px;
    cursor: pointer; transition: transform .1s ease, opacity .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn-spin { background: var(--accent); color: #fff; }
  .btn-spin:disabled { opacity: .45; cursor: default; }
  .btn-remove { background: var(--bg); color: var(--text); font-size: 13px; flex: 0 0 auto; padding: 13px 15px; }
  .btn-remove:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<main class="app">
  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="1040" height="1040"></canvas>
    <button class="hub" id="spin-hub">
      <span class="finger">👆</span>
      <span>돌려!</span>
    </button>
  </div>

  <section class="panel">
    <h1>돌림판 🎡</h1>
    <p class="sub">항목을 추가하면 판이 바로 바뀌어요. (2개부터 돌릴 수 있어요)</p>

    <div class="item-list" id="item-list"></div>
    <div class="input-row">
      <input id="item-input" type="text" placeholder="항목 이름 입력" maxlength="20">
      <button class="btn-add" id="add-btn">추가</button>
    </div>
    <div class="count" id="count"></div>

    <div class="result" id="result"><span class="hint">돌림판을 돌려보세요</span></div>
    <div class="row">
      <button class="btn btn-spin" id="spin-btn">돌리기</button>
      <button class="btn btn-remove" id="remove-btn" disabled>당첨 빼기</button>
    </div>
  </section>
</main>

<script>
(function () {
  const KEY = 'wheel-items-v2';
  const OLD_KEY = 'wheel-items';
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const listEl = document.getElementById('item-list');
  const inputEl = document.getElementById('item-input');
  const addBtn = document.getElementById('add-btn');
  const countEl = document.getElementById('count');
  const resultEl = document.getElementById('result');
  const spinBtn = document.getElementById('spin-btn');
  const hubBtn = document.getElementById('spin-hub');
  const removeBtn = document.getElementById('remove-btn');

  const PALETTE = ['#3182f6','#ff6b6b','#20c997','#f2a33c','#845ef7','#f06595',
                   '#15aabf','#94d82d','#ff922b','#5c7cfa','#e64980','#38d9a9'];
  const SIZE = 1040, R = SIZE / 2 - 14, CX = SIZE / 2, CY = SIZE / 2;

  let items = [];
  let angle = 0;
  let spinning = false;
  let lastWinner = null;

  function colorOf(i, n) {
    if (n > 1 && i === n - 1 && i % PALETTE.length === 0) return PALETTE[1];
    return PALETTE[i % PALETTE.length];
  }

  function save() { localStorage.setItem(KEY, JSON.stringify(items)); }

  function renderList() {
    if (!items.length) {
      listEl.innerHTML = '';
      listEl.insertAdjacentHTML('beforebegin', '');
      listEl.innerHTML = '<div class="empty-note">아래 입력란에서 항목을 추가해보세요</div>';
    } else {
      listEl.innerHTML = items.map((name, i) => `
        <div class="item-row">
          <span class="dot" style="background:${colorOf(i, items.length)}"></span>
          <span class="name">${escapeHtml(name)}</span>
          <button type="button" class="del" data-i="${i}" title="삭제">✕</button>
        </div>`).join('');
      listEl.querySelectorAll('.del').forEach(b => b.addEventListener('click', () => {
        items.splice(Number(b.dataset.i), 1);
        lastWinner = null; removeBtn.disabled = true;
        update();
      }));
    }
    countEl.textContent = items.length ? `${items.length}개 항목` : '';
    const ok = items.length >= 2;
    spinBtn.disabled = !ok || spinning;
    hubBtn.disabled = !ok || spinning;
  }

  function update() { save(); renderList(); draw(); }

  function addItem() {
    const name = inputEl.value.trim();
    if (!name) { inputEl.focus(); return; }
    items.push(name);
    inputEl.value = '';
    inputEl.focus();
    update();
  }

  function draw() {
    ctx.clearRect(0, 0, SIZE, SIZE);
    const n = items.length;
    if (!n) {
      ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2);
      ctx.fillStyle = '#e9ecef'; ctx.fill();
      return;
    }
    const seg = (Math.PI * 2) / n;
    for (let i = 0; i < n; i++) {
      const a0 = angle + i * seg - Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.arc(CX, CY, R, a0, a0 + seg);
      ctx.closePath();
      ctx.fillStyle = n === 1 ? PALETTE[0] : colorOf(i, n);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.9)';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.save();
      ctx.translate(CX, CY);
      ctx.rotate(a0 + seg / 2);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      const label = items[i].length > 10 ? items[i].slice(0, 10) + '…' : items[i];
      const fs = Math.min(44, Math.max(22, 340 / Math.max(label.length, 4)));
      ctx.font = `800 ${fs}px Pretendard, "Apple SD Gothic Neo", sans-serif`;
      ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 6;
      ctx.fillText(label, R - 34, 0);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(CX, CY, R + 6, 0, Math.PI * 2);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 12; ctx.stroke();
  }

  function winnerAt(a) {
    const n = items.length;
    const seg = (Math.PI * 2) / n;
    let rel = ((-a) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    return Math.floor(rel / seg) % n;
  }

  function spin() {
    if (spinning || items.length < 2) return;
    spinning = true;
    lastWinner = null;
    removeBtn.disabled = true;
    spinBtn.disabled = true; hubBtn.disabled = true;
    resultEl.className = 'result';
    resultEl.innerHTML = '<span class="hint">두구두구두구…</span>';

    const turns = 5 + Math.random() * 3;
    const target = angle + turns * Math.PI * 2 + Math.random() * Math.PI * 2;
    const start = angle;
    const dur = 4200 + Math.random() * 800;
    const t0 = performance.now();

    function frame(t) {
      const p = Math.min((t - t0) / dur, 1);
      const ease = 1 - Math.pow(1 - p, 3);
      angle = start + (target - start) * ease;
      draw();
      if (p < 1) {
        requestAnimationFrame(frame);
      } else {
        spinning = false;
        const idx = winnerAt(angle);
        lastWinner = idx;
        resultEl.className = 'result win';
        resultEl.innerHTML = `<div><div class="who">🎉 ${escapeHtml(items[idx])}</div></div>`;
        spinBtn.disabled = false; hubBtn.disabled = false;
        removeBtn.disabled = false;
      }
    }
    requestAnimationFrame(frame);
  }

  function removeWinner() {
    if (lastWinner === null) return;
    items.splice(lastWinner, 1);
    lastWinner = null;
    removeBtn.disabled = true;
    resultEl.className = 'result';
    resultEl.innerHTML = '<span class="hint">당첨 항목을 뺐어요. 다시 돌려보세요!</span>';
    update();
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  addBtn.addEventListener('click', addItem);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
  spinBtn.addEventListener('click', spin);
  hubBtn.addEventListener('click', spin);
  removeBtn.addEventListener('click', removeWinner);

  // 저장 복원 — 구버전(텍스트) 기록도 이관
  try {
    items = JSON.parse(localStorage.getItem(KEY)) || [];
  } catch (e) { items = []; }
  if (!items.length) {
    const old = localStorage.getItem(OLD_KEY);
    if (old) items = old.split('\n').map(s => s.trim()).filter(Boolean);
  }
  if (!items.length) items = ['쭈꾸미', '돈까스', '평양냉면', '닭곰탕'];
  update();
})();
</script>
</body>
</html>
